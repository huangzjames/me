  function init() {
    preloadTheme();
    onScroll();
    animate();

    const backToTop = document.getElementById("back-to-top");
    backToTop?.addEventListener("click", (event) => scrollToTop(event));

    const backToPrev = document.getElementById("back-to-prev");

    const darkThemeButton = document.getElementById("dark-theme-button");
    if (darkThemeButton && !darkThemeButton.dataset.bound) {
      darkThemeButton.dataset.bound = "1";
      darkThemeButton.addEventListener("click", () => {
        if (document.documentElement.classList.contains("dark")) return;
        toggleThemeWithCrossfade(true);
      });
    }

    const themeLedToggle = document.getElementById("theme-led-toggle");
    if (themeLedToggle && !themeLedToggle.dataset.bound) {
      themeLedToggle.dataset.bound = "1";
      themeLedToggle.addEventListener("click", () => {
        const isDark = document.documentElement.classList.contains("dark");
        toggleThemeWithCrossfade(!isDark);
      });
    }

    /*

    window.matchMedia("(prefers-color-scheme: dark)")

    document.addEventListener("scroll", onScroll);
  }

  function animate() {
    const animateElements = document.querySelectorAll(".animate");

    animateElements.forEach((element, index) => {
      setTimeout(() => {
        element.classList.add("show");
      }, index * 150);
    });
  }

  function onScroll() {
    if (window.scrollY > 0) {
      document.documentElement.classList.add("scrolled");
    } else {
      document.documentElement.classList.remove("scrolled");
    }
  }

  function scrollToTop(event) {

    const meta = document.getElementById("theme-color-meta");

  }

function toggleTheme(dark) {
    const css = document.createElement("style");

    css.appendChild(

             -moz-transition: none !important;

    );

    document.head.appendChild(css);

    if (dark) {
      document.documentElement.classList.add("dark");
    } else {
      document.documentElement.classList.remove("dark");
    }

  window.getComputedStyle(css).opacity;
    document.head.removeChild(css);
    setThemeColor(dark);
  }

  let themeTransitionBusy = false;

  const THEME_MORPH_TIMING = {
    duration: 520,
    swapAt: 0.7,
    fadeOut: 200,
  };

  function cleanupThemeMorph() {
    const overlay = document.getElementById("theme-transition-overlay");
    if (overlay) {
      overlay.classList.remove("is-morphing", "is-fading-out", "to-dark", "to-light");
    }
    themeTransitionBusy = false;
  }

  function toggleThemeWithCrossfade(nextDark) {
    if (themeTransitionBusy) return;

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      localStorage.setItem("theme", nextDark ? "dark" : "light");
      toggleTheme(nextDark);
      return;
    }

    const overlay = document.getElementById("theme-transition-overlay");
    if (!overlay) {
      localStorage.setItem("theme", nextDark ? "dark" : "light");
      toggleTheme(nextDark);
      return;
    }

    themeTransitionBusy = true;
    localStorage.setItem("theme", nextDark ? "dark" : "light");

    const { duration, swapAt, fadeOut } = THEME_MORPH_TIMING;
    const swapDelay = Math.round(duration * swapAt);
    let swapTimeout;
    let morphFallback;
    let fadeOutFallback;

    const finish = () => {
      clearTimeout(swapTimeout);
      clearTimeout(morphFallback);
      clearTimeout(fadeOutFallback);
      cleanupThemeMorph();
    };

    const startFadeOut = () => {
      overlay.classList.remove("is-morphing");
      overlay.classList.add("is-fading-out");

      const onFadeOutEnd = (event) => {
        if (event.propertyName !== "opacity") return;
        overlay.removeEventListener("transitionend", onFadeOutEnd);
        finish();
      };

      overlay.addEventListener("transitionend", onFadeOutEnd);
      fadeOutFallback = setTimeout(() => {

    overlay.classList.remove("is-morphing", "is-fading-out", "to-dark", "to-light");
    overlay.classList.add(nextDark ? "to-dark" : "to-light");

    swapTimeout = setTimeout(() => toggleTheme(nextDark), swapDelay);

    overlay.addEventListener("animationend", onMorphEnd);
    morphFallback = setTimeout(() => {
      overlay.removeEventListener("animationend", onMorphEnd);
      toggleTheme(nextDark);
      startFadeOut();
    }, duration + 100);

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        overlay.classList.add("is-morphing");
      });
    });
  }

  document.addEventListener("astro:before-swap", () => {
    if (themeTransitionBusy) {
      cleanupThemeMorph();
    }
  });

  function preloadTheme() {
    const userTheme = localStorage.theme;

    if (userTheme === "light" || userTheme === "dark") {
      toggleTheme(userTheme === "dark");
    } else {
      toggleTheme(window.matchMedia("(prefers-color-scheme: dark)").matches);
    }
  }

  document.addEventListener("DOMContentLoaded", () => init());
  document.addEventListener("astro:after-swap", () => init());

  function readMetrics() {
    const doc = document.documentElement;
    const overflow = doc.scrollWidth - window.innerWidth;
    const bodyOverflow = document.body.scrollWidth - window.innerWidth;
    const canScrollX = doc.scrollWidth > doc.clientWidth + 1;

    return {
      overflow,
      bodyOverflow,
      canScrollX,
      scrollLeft: doc.scrollLeft,
      innerWidth: window.innerWidth,
      scrollWidth: doc.scrollWidth,
      theme: doc.classList.contains("dark") ? "深色" : "浅色",
      updated: new Date().toLocaleTimeString(),
    };
  }

  function renderMetrics() {
    const data = readMetrics();
    document.getElementById("debug-overflow").textContent = `${data.overflow}px`;
    document.getElementById("debug-body-overflow").textContent = `${data.bodyOverflow}px`;
    document.getElementById("debug-can-scroll-x").textContent = data.canScrollX ? "是" : "否";
    document.getElementById("debug-scroll-left").textContent = `${data.scrollLeft}px`;
    document.getElementById("debug-inner-width").textContent = `${data.innerWidth}px`;
    document.getElementById("debug-scroll-width").textContent = `${data.scrollWidth}px`;
    document.getElementById("debug-theme").textContent = data.theme;
    document.getElementById("debug-updated").textContent = data.updated;
  }

  function bindDebugMetrics() {
    renderMetrics();
    window.addEventListener("resize", renderMetrics, { passive: true });
    window.addEventListener("orientationchange", renderMetrics, { passive: true });
    window.addEventListener("scroll", renderMetrics, { passive: true });
    document.addEventListener("dblclick", () => {
      window.setTimeout(renderMetrics, 0);
      window.setTimeout(renderMetrics, 300);
    });
  }

  document.addEventListener("DOMContentLoaded", bindDebugMetrics);
  document.addEventListener("astro:page-load", bindDebugMetrics);
  bindDebugMetrics();
</script>
